# Place limit_req_zone directives in nginx's http {} context.
limit_req_zone $binary_remote_addr zone=checkout:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
server {
    listen 443 ssl;
    server_name payments.your-domain.com;
    ssl_certificate /etc/letsencrypt/live/payments.your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/payments.your-domain.com/privkey.pem;
    client_max_body_size 32k;
    limit_req_status 429;
    access_log off; # Checkout tokens must not be written to access logs.
    add_header Strict-Transport-Security 'max-age=31536000' always;
    location = /webhooks/hashpay {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
    }
    location ~ /pay$ {
        limit_req zone=checkout burst=5 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
    }
    location / {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
    }
}
server {
    listen 80;
    server_name payments.your-domain.com;
    return 301 https://$host$request_uri;
}
